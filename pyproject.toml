[project]
name = "numbers-math-bot"
version = "2.0.0"
description = "Telegram bot that drills mental arithmetic, with usage analytics and a LAN admin dashboard"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.10",
    # Required by aiogram to route Bot API traffic through the xray proxy.
    "aiohttp-socks>=0.9",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "admin"]
