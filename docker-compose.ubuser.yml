# Deployment stack for the home server.
#
# Differences from the local stack:
#   - Telegram and OpenRouter traffic goes through an existing xray container on
#     an external Docker network, named by PROXY_NETWORK. Verified on the target
#     host: OpenRouter direct returns 403, through the proxy 200. Addressing the
#     proxy by its container alias keeps it stable across reboots, unlike an IP.
#   - LM Studio is on the same LAN and is reached directly at LMSTUDIO_BASE_URL;
#     it must never go through the proxy.
#   - The dashboard is published on the single LAN address in ADMIN_WEB_BIND,
#     never on 0.0.0.0.
#
# Run: docker compose -f docker-compose.ubuser.yml up -d --build
services:
  redis:
    image: local-hardened/numbers-redis-1:ca-20261022-v2
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  bot:
    image: local-hardened/numbers-bot-1:ca-20261022-v2
    build: .
    env_file: .env
    environment:
      REDIS: redis:6379
      DB_PATH: /data/numbers.sqlite3
      HTTP_PROXY_URL: http://xray:10809
    volumes:
      - bot-data:/data
    networks:
      - internal
      - proxy
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    image: local-hardened/numbers-admin-1:ca-20261022-v2
    build: .
    command: ["python", "-m", "admin.app"]
    env_file: .env
    environment:
      DB_PATH: /data/numbers.sqlite3
      HTTP_PROXY_URL: http://xray:10809
    volumes:
      - bot-data:/data
    networks:
      - internal
      - proxy
    ports:
      - "${ADMIN_WEB_BIND:-127.0.0.1}:${ADMIN_WEB_PORT:-8080}:8080"
    depends_on:
      - bot
    restart: unless-stopped

networks:
  internal:
  proxy:
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the external network the proxy is on}
    external: true

volumes:
  redis-data:
  bot-data:
